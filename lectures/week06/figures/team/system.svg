<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc"><title id="title">Essay team with a coordinator</title><desc id="desc">The user sends the question to the coordinator. The coordinator exchanges tasks and results with the writer and the evaluator, and returns the final essay.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="1000" height="260" fill="white"/><path d="M185 130 L300 130" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="10" y="90" width="175" height="80" rx="9" fill="#f4f4f4" stroke="#6c737c" stroke-width="2"/><text x="97.5" y="139.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">User</text><rect x="310" y="90" width="220" height="80" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="420.0" y="139.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Coordinator</text><path d="M530 130 L700 58" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="710" y="25" width="270" height="65" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="845.0" y="66.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Writer</text><path d="M530 130 L700 202" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="710" y="170" width="270" height="65" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="845.0" y="211.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Evaluator</text><text x="245" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">question</text><text x="245" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">essay</text><text x="572" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">tasks and results</text></svg>