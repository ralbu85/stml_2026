<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-labelledby="title desc"><title id="title">Essay team dependencies</title><desc id="desc">The question goes to the writer. The essay goes to the evaluator. The evaluation goes back to the writer, who improves the essay.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="1000" height="170" fill="white"/><rect x="10" y="45" width="150" height="80" rx="9" fill="#f4f4f4" stroke="#6c737c" stroke-width="2"/><text x="85.0" y="78.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Essay</text><text x="85.0" y="110.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">question</text><path d="M160 85 L215 85" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="225" y="45" width="170" height="80" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="310.0" y="94.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Writer</text><path d="M395 85 L505 85" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/><text x="450" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">essay</text><rect x="515" y="45" width="190" height="80" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="610.0" y="94.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Evaluator</text><path d="M705 85 L835 85" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/><text x="770" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">evaluation</text><rect x="845" y="45" width="145" height="80" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="917.5" y="94.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Writer</text></svg>