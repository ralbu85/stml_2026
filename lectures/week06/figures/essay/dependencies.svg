<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc"><title id="title">Essay task dependencies</title><desc id="desc">The essay question goes to two researchers who work in parallel. The writer needs both sets of notes; the reviewer checks the draft.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="1000" height="310" fill="white"/><path d="M170 150 L240 68" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M170 162 L240 250" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M480 65 L560 135" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M480 247 L560 174" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M780 155 L815 155" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="10" y="116" width="160" height="80" rx="9" fill="#f4f4f4" stroke="#6c737c" stroke-width="2"/><text x="90.0" y="149.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Essay</text><text x="90.0" y="181.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">question</text><rect x="250" y="25" width="230" height="80" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="365.0" y="74.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Researcher A</text><rect x="250" y="210" width="230" height="80" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="365.0" y="259.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Researcher B</text><rect x="570" y="116" width="210" height="80" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="6