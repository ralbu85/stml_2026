<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc"><title id="title">Essay team with a coordinator</title><desc id="desc">The user sends the essay question to the coordinator. The coordinator exchanges tasks and results with researcher A, researcher B, the writer, and the reviewer, and returns the final essay.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="1000" height="390" fill="white"/><path d="M185 195 L300 195" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="10" y="155" width="175" height="80" rx="9" fill="#f4f4f4" stroke="#6c737c" stroke-width="2"/><text x="97.5" y="204.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">User</text><rect x="310" y="155" width="220" height="80" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="420.0" y="204.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Coordinator</text><path d="M530 195 L700 52" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="710" y="20" width="270" height="65" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="845.0" y="61.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Researcher A</text><path d="M530 195 L700 147" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="710" y="115" width="270" height="65" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="845.0" y="156.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Researcher B</text><path d="M530 195 L700 242" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="710" y="210" width="270" height="65" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="845.0" y="251.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Writer</text><path d="M530 195 L700 337" fill="none" stroke="#334155" stroke-width="2.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="710" y="305" width="270" height="65" rx="9" fill="#f0f5fb" stroke="#526e97" stroke-width="2"/><text x="845.0" y="346.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Reviewer</text><text x="245" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">question</text><text x="245" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">essay</text><text x="620" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">tasks and results</text></svg>