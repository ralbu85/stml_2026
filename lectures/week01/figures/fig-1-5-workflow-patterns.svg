<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c26a3a"/>
    </marker>
    <style>
      .n  { fill: white; stroke: #444; stroke-width: 1.6; }
      .io { fill: #eef2f7; stroke: #8fa8c4; stroke-width: 1.4; }
      .g  { fill: #f4f1e8; stroke: #b9ab84; stroke-width: 1.4; }
      .t  { font-size: 12.5px; fill: #222; text-anchor: middle; }
      .h  { font-size: 15px; font-weight: 600; fill: #222; }
      .c  { font-size: 11.5px; fill: #777; }
      .e  { stroke: #555; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1220" height="560" fill="white"/>

  <!-- 1. Prompt chaining -->
  <text x="40" y="36" class="h">1 &#183; Prompt chaining</text>
  <text x="40" y="56" class="c">a task split into fixed steps; a gate can check the middle</text>
  <g transform="translate(40,74)">
    <rect x="0" y="0" width="76" height="34" rx="5" class="io"/><text x="38" y="22" class="t">In</text>
    <line x1="78" y1="17" x2="104" y2="17" class="e" marker-end="url(#p)"/>
    <rect x="106" y="0" width="76" height="34" rx="5" class="n"/><text x="144" y="22" class="t">LLM 1</text>
    <line x1="184" y1="17" x2="210" y2="17" class="e" marker-end="url(#p)"/>
    <rect x="212" y="0" width="62" height="34" rx="5" class="g"/><text x="243" y="22" class="t">gate</text>
    <line x1="276" y1="17" x2="302" y2="17" class="e" marker-end="url(#p)"/>
    <rect x="304" y="0" width="76" height="34" rx="5" class="n"/><text x="342" y="22" class="t">LLM 2</text>
    <line x1="382" y1="17" x2="408" y2="17" class="e" marker-end="url(#p)"/>
    <rect x="410" y="0" width="76" height="34" rx="5" class="io"/><text x="448" y="22" class="t">Out</text>
  </g>

  <!-- 2. Routing -->
  <text x="640" y="36" class="h">2 &#183; Routing</text>
  <text x="640" y="56" class="c">an input classified, then sent down one specialized path</text>
  <g transform="translate(640,70)">
    <rect x="0" y="26" width="76" height="34" rx="5" class="io"/><text x="38" y="48" class="t">In</text>
    <line x1="78" y1="43" x2="104" y2="43" class="e" marker-end="url(#p)"/>
    <rect x="106" y="26" width="94" height="34" rx="5" class="n"/><text x="153" y="48" class="t">classify</text>
    <path d="M 202 43 L 226 12" class="e" marker-end="url(#p)"/>
    <path d="M 202 43 L 226 43" class="e" marker-end="url(#p)"/>
    <path d="M 202 43 L 226 74" class="e" marker-end="url(#p)"/>
    <rect x="228" y="-5" width="112" height="30" rx="5" class="n"/><text x="284" y="15" class="t">general</text>
    <rect x="228" y="28" width="112" height="30" rx="5" class="n"/><text x="284" y="48" class="t">refund</text>
    <rect x="228" y="61" width="112" height="30" rx="5" class="n"/><text x="284" y="81" class="t">technical</text>
  </g>

  <!-- 3. Parallelization -->
  <text x="40" y="216" class="h">3 &#183; Parallelization</text>
  <text x="40" y="236" class="c">sectioning &#8212; independent subtasks at once; voting &#8212; the same task run several times</text>
  <g transform="translate(40,252)">
    <rect x="0" y="26" width="76" height="34" rx="5" class="io"/><text x="38" y="48" class="t">In</text>
    <path d="M 78 43 L 104 12" class="e" marker-end="url(#p)"/>
    <path d="M 78 43 L 104 43" class="e" marker-end="url(#p)"/>
    <path d="M 78 43 L 104 74" class="e" marker-end="url(#p)"/>
    <rect x="106" y="-5" width="76" height="30" rx="5" class="n"/><text x="144" y="15" class="t">LLM</text>
    <rect x="106" y="28" width="76" height="30" rx="5" class="n"/><text x="144" y="48" class="t">LLM</text>
    <rect x="106" y="61" width="76" height="30" rx="5" class="n"/><text x="144" y="81" class="t">LLM</text>
    <path d="M 184 10 L 210 40" class="e" marker-end="url(#p)"/>
    <path d="M 184 43 L 210 43" class="e" marker-end="url(#p)"/>
    <path d="M 184 76 L 210 46" class="e" marker-end="url(#p)"/>
    <rect x="212" y="26" width="94" height="34" rx="5" class="g"/><text x="259" y="48" class="t">aggregate</text>
    <line x1="308" y1="43" x2="334" y2="43" class="e" marker-end="url(#p)"/>
    <rect x="336" y="26" width="76" height="34" rx="5" class="io"/><text x="374" y="48" class="t">Out</text>
  </g>

  <!-- 4. Orchestrator-workers -->
  <text x="640" y="216" class="h">4 &#183; Orchestrator&#8211;workers</text>
  <text x="640" y="236" class="c">subtasks are not predefined; the orchestrator creates them from the input</text>
  <g transform="translate(640,252)">
    <rect x="0" y="26" width="76" height="34" rx="5" class="io"/><text x="38" y="48" class="t">In</text>
    <line x1="78" y1="43" x2="104" y2="43" class="e" marker-end="url(#p)"/>
    <rect x="106" y="20" width="106" height="46" rx="5" class="n" stroke-width="2.2"/>
    <text x="159" y="40" class="t">Orchestrator</text><text x="159" y="56" class="t" style="font-size:11px;fill:#777">LLM</text>
    <path d="M 214 43 L 240 12" class="e" marker-end="url(#p)"/>
    <path d="M 214 43 L 240 43" class="e" marker-end="url(#p)"/>
    <path d="M 214 43 L 240 74" class="e" marker-end="url(#p)"/>
    <rect x="242" y="-5" width="84" height="30" rx="5" class="n"/><text x="284" y="15" class="t">worker</text>
    <rect x="242" y="28" width="84" height="30" rx="5" class="n"/><text x="284" y="48" class="t">worker</text>
    <rect x="242" y="61" width="84" height="30" rx="5" class="n"/><text x="284" y="81" class="t">worker</text>
    <path d="M 328 10 L 352 40" class="e" marker-end="url(#p)"/>
    <path d="M 328 43 L 352 43" class="e" marker-end="url(#p)"/>
    <path d="M 328 76 L 352 46" class="e" marker-end="url(#p)"/>
    <rect x="354" y="26" width="94" height="34" rx="5" class="g"/><text x="401" y="48" class="t">synthesize</text>
  </g>

  <!-- 5. Evaluator-optimizer -->
  <text x="40" y="416" class="h">5 &#183; Evaluator&#8211;optimizer</text>
  <text x="40" y="436" class="c">one call generates, another judges; the loop runs until the judgement passes</text>
  <g transform="translate(40,456)">
    <rect x="0" y="14" width="76" height="34" rx="5" class="io"/><text x="38" y="36" class="t">In</text>
    <line x1="78" y1="31" x2="104" y2="31" class="e" marker-end="url(#p)"/>
    <rect x="106" y="14" width="108" height="34" rx="5" class="n"/><text x="160" y="36" class="t">generator</text>
    <line x1="216" y1="31" x2="248" y2="31" class="e" marker-end="url(#p)"/>
    <rect x="250" y="14" width="108" height="34" rx="5" class="n"/><text x="304" y="36" class="t">evaluator</text>
    <line x1="360" y1="31" x2="392" y2="31" class="e" marker-end="url(#p)"/>
    <rect x="394" y="14" width="80" height="34" rx="5" class="io"/><text x="434" y="36" class="t">accepted</text>
    <path d="M 304 52 C 304 82 160 82 160 54" fill="none" stroke="#c26a3a" stroke-width="1.7" marker-end="url(#pf)"/>
    <text x="232" y="98" class="t" style="fill:#c26a3a">rejected &#8212; with the critique attached</text>
  </g>

  <text x="640" y="470" class="c">All five: Anthropic, &#8220;Building Effective Agents&#8221; (2024).</text>
  <text x="640" y="492" class="c">The order of the steps is fixed by the code in every one of them &#8212;</text>
  <text x="640" y="512" class="c">which is what makes them workflows rather than agents.</text>
</svg>
