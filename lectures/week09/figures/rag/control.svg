<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">Basic RAG workflow and agent retrieval loop</title><desc id="desc">The top row shows retrieval then generation. The bottom loop has the model choose a search action or an answer using the request and current observations. Tool results return to the model.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs>
<rect width="1120" height="620" fill="white"/>
<text x="560" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#435267">Basic retrieve-then-generate workflow</text>
<rect x="20" y="65" width="200" height="85" rx="8" fill="#f3f4f6" stroke="#667085" stroke-width="2"/>
<text x="120.0" y="115.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Question</text>
<rect x="320" y="65" width="200" height="85" rx="8" fill="#eef7f0" stroke="#568267" stroke-width="2"/>
<text x="420.0" y="115.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Retrieve</text>
<rect x="625" y="65" width="220" height="85" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="735.0" y="115.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Generate</text>
<rect x="950" y="65" width="150" height="85" rx="8" fill="#f3f4f6" stroke="#667085" stroke-width="2"/>
<text x="1025.0" y="115.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Answer</text>
<path d="M220 108 H320" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M520 108 H625" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M845 108 H950" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="572" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#435267">Evidence</text>
<text x="560" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#435267">Agent chooses the next search or answer</text>
<rect x="20" y="275" width="220" height="90" rx="8" fill="#f3f4f6" stroke="#667085" stroke-width="2"/>
<text x="130.0" y="328.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Request</text>
<rect x="390" y="275" width="300" height="90" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="540.0" y="311.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Use observations</text>
<text x="540.0" y="345.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">to choose an action</text>
<rect x="905" y="275" width="195" height="90" rx="8" fill="#f3f4f6" stroke="#667085" stroke-width="2"/>
<text x="1002.5" y="328.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Answer</text>
<path d="M240 320 H390" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M690 320 H905" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="795" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">Answer</text>
<rect x="390" y="485" width="300" height="90" rx="8" fill="#eef7f0" stroke="#568267" stroke-width="2"/>
<text x="540.0" y="538.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Retrieve passages</text>
<path d="M465 365 V485" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="335" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">Search query</text>
<path d="M690 530 H790 V415 H615 V365" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="906" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">Passages</text>
<text x="906" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#435267">+ sources</text>
</svg>
