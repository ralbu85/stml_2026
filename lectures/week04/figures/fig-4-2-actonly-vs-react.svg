<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="410" fill="white"/>

  <text x="450" y="36" text-anchor="middle" font-size="12.5" fill="#555">same question: what else controls the program the Apple Remote was designed for?</text>

  <line x1="450" y1="52" x2="450" y2="366" stroke="#cccccc" stroke-dasharray="4 4"/>

  <!-- ============ left: Act-only ============ -->
  <text x="52" y="74" font-size="15" font-weight="600" fill="#222">Act-only</text>
  <text x="52" y="92" font-size="12" fill="#666">actions and observations only</text>

  <text x="52" y="120" font-size="12" fill="#222">Action 1: search[Apple Remote]</text>
  <text x="52" y="141" font-size="12" fill="#777">Obs 1: &#8230; designed to control Front Row &#8230;</text>
  <text x="52" y="169" font-size="12" fill="#222">Action 2: search[Front Row]</text>
  <text x="52" y="190" font-size="12" fill="#777">Obs 2: not found &#8594; Front Row (software)</text>
  <text x="52" y="218" font-size="12" fill="#222">Action 3: search[Front Row (software)]</text>
  <text x="52" y="239" font-size="12" fill="#777">Obs 3: &#8230; a discontinued media center &#8230;</text>

  <rect x="46" y="253" width="136" height="21" rx="4" fill="white" stroke="#b3554e" stroke-width="1.5"/>
  <text x="52" y="268" font-size="12" fill="#222">Action 4: finish[yes]</text>
  <text x="190" y="268" font-size="12" fill="#b3554e">(wrong)</text>

  <!-- ============ right: ReAct ============ -->
  <text x="490" y="74" font-size="15" font-weight="600" fill="#222">ReAct</text>
  <text x="490" y="92" font-size="12" fill="#666">a Thought written before every action</text>

  <rect x="484" y="106" width="348" height="19" rx="3" fill="#dbe7f5" fill-opacity="0.5"/>
  <text x="490" y="120" font-size="12" fill="#4a7dbe">Thought 1: search Apple Remote for its program</text>
  <text x="490" y="141" font-size="12" fill="#222">Action 1: search[Apple Remote]</text>
  <text x="490" y="162" font-size="12" fill="#777">Obs 1: &#8230; designed to control Front Row &#8230;</text>

  <rect x="484" y="176" width="348" height="19" rx="3" fill="#dbe7f5" fill-opacity="0.5"/>
  <text x="490" y="190" font-size="12" fill="#4a7dbe">Thought 2: Front Row confirmed; find its controllers</text>
  <text x="490" y="211" font-size="12" fill="#222">Action 2: search[Front Row]</text>
  <text x="490" y="232" font-size="12" fill="#777">Obs 2: not found &#8594; Front Row (software)</text>

  <rect x="484" y="246" width="348" height="19" rx="3" fill="#dbe7f5" fill-opacity="0.5"/>
  <text x="490" y="260" font-size="12" fill="#4a7dbe">Thought 3: retry with Front Row (software)</text>
  <text x="490" y="281" font-size="12" fill="#222">Action 3: search[Front Row (software)]</text>
  <text x="490" y="302" font-size="12" fill="#777">Obs 3: &#8230; Apple Remote or the keyboard function keys</text>

  <rect x="484" y="316" width="348" height="19" rx="3" fill="#dbe7f5" fill-opacity="0.5"/>
  <text x="490" y="330" font-size="12" fill="#4a7dbe">Thought 4: the answer is keyboard function keys</text>

  <rect x="484" y="337" width="262" height="21" rx="4" fill="white" stroke="#4e8a52" stroke-width="1.5"/>
  <text x="490" y="352" font-size="12" fill="#222">Action 4: finish[keyboard function keys]</text>
  <text x="754" y="352" font-size="12" fill="#4e8a52">(correct)</text>

  <text x="450" y="392" text-anchor="middle" font-size="12.5" fill="#666">the searches match; the Thought lines change what the termination can read</text>
</svg>
