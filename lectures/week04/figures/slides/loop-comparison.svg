<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="540" viewBox="0 0 1300 540" role="img"><title>ReAct adds an assessment before the search request and keeps it in the conversation</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#63788C"/></marker></defs><rect width="1300" height="540" fill="white"/>
<text x="650" y="34" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#18334A">Tool-request branch in both versions</text>
<rect x="20" y="65" width="905" height="155" rx="12" fill="#EAF2FC" stroke="#C4D0DA" stroke-width="1.5"/>
<rect x="1000" y="65" width="280" height="155" rx="12" fill="#EAF6F0" stroke="#C4D0DA" stroke-width="1.5"/>
<text x="42" y="100" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#18334A">Basic · LLM response (one call)</text>
<path d="M927,160 H992" fill="none" stroke="#63788C" stroke-width="3" marker-end="url(#a)"/>
<text x="1140" y="100" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#18334A">Tool reply</text>
<text x="1140" y="152" font-family="Arial,sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#18334A">Returned</text>
<text x="1140" y="197" font-family="Arial,sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#18334A">passages</text>
<path d="M1140,222 V240 H460 V227" fill="none" stroke="#63788C" stroke-width="3" marker-end="url(#a)"/>
<rect x="20" y="315" width="905" height="155" rx="12" fill="#EAF2FC" stroke="#C4D0DA" stroke-width="1.5"/>
<rect x="1000" y="315" width="280" height="155" rx="12" fill="#EAF6F0" stroke="#C4D0DA" stroke-width="1.5"/>
<text x="42" y="350" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#18334A">ReAct · LLM response (one call)</text>
<path d="M927,410 H992" fill="none" stroke="#63788C" stroke-width="3" marker-end="url(#a)"/>
<text x="1140" y="350" font-family="Arial,sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#18334A">Tool reply</text>
<text x="1140" y="402" font-family="Arial,sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#18334A">Returned</text>
<text x="1140" y="447" font-family="Arial,sans-serif" font-size="36" font-weight="400" text-anchor="middle" fill="#18334A">passages</text>
<path d="M1140,472 V490 H460 V477" fill="none" stroke="#63788C" stroke-width="3" marker-end="url(#a)"/>
<text x="52" y="180" font-family="Arial,sans-serif" font-size="38" font-weight="400" text-anchor="start" fill="#18334A">Action: search(query)</text>
<text x="650" y="282" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#18334A">Next input adds: request + reply</text>
<rect x="40" y="359" width="865" height="52" rx="12" fill="#FFF1D9" stroke="#C4D0DA" stroke-width="1.5"/>
<text x="54" y="396" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="start" fill="#18334A">Thought: what evidence is still missing?</text>
<text x="52" y="453" font-family="Arial,sans-serif" font-size="38" font-weight="400" text-anchor="start" fill="#18334A">Action: search(query)</text>
<text x="650" y="532" font-family="Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#18334A">Next input adds: Thought + request + reply</text>
