<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7dbe"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3554e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="410" fill="white"/>

  <!-- run -->
  <rect x="60" y="184" width="180" height="52" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="150" y="204" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Run</text>
  <text x="150" y="221" text-anchor="middle" font-size="11.5" fill="#555">evalset &#8594; failures</text>

  <!-- read & label -->
  <rect x="290" y="60" width="200" height="52" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="390" y="80" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Read &#38; label</text>
  <text x="390" y="97" text-anchor="middle" font-size="11.5" fill="#555">one cause per failure</text>

  <!-- count -->
  <rect x="560" y="184" width="120" height="52" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="620" y="204" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Count</text>
  <text x="620" y="221" text-anchor="middle" font-size="11.5" fill="#555">labels &#8594; counts</text>

  <!-- fix one thing -->
  <rect x="290" y="304" width="200" height="56" rx="6" fill="#fff7e0" stroke="#c9a227"/>
  <text x="390" y="326" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Fix one thing</text>
  <text x="390" y="343" text-anchor="middle" font-size="11.5" fill="#555">one change per re-run</text>

  <!-- ring arrows -->
  <path d="M 150 184 L 150 86 L 286 86" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 490 86 L 620 86 L 620 180" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 286 332 L 150 332 L 150 240" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="162" y="286" font-size="11.5" fill="#555">re-run</text>

  <!-- label-count chart at the count node -->
  <line x1="680" y1="210" x2="712" y2="210" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="716" y="96" width="174" height="224" rx="6" fill="#fafafa" stroke="#dddddd"/>
  <text x="803" y="118" text-anchor="middle" font-size="11.5" fill="#555">11 failures, 4 labels</text>

  <text x="730" y="138" font-size="11.5" fill="#222">query too literal &#183; 5</text>
  <rect x="730" y="144" width="135" height="13" fill="#4a7dbe"/>
  <text x="730" y="184" font-size="11.5" fill="#555">format violated &#183; 3</text>
  <rect x="730" y="190" width="81" height="13" fill="#cccccc"/>
  <text x="730" y="230" font-size="11.5" fill="#555">constraint ignored &#183; 2</text>
  <rect x="730" y="236" width="54" height="13" fill="#cccccc"/>
  <text x="730" y="276" font-size="11.5" fill="#555">item defect &#183; 1</text>
  <rect x="730" y="282" width="27" height="13" fill="#cccccc"/>

  <!-- count feeds the choice -->
  <path d="M 770 320 L 770 332 L 494 332" fill="none" stroke="#4a7dbe" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="630" y="323" text-anchor="middle" font-size="11.5" fill="#4a7dbe">largest group first</text>

  <!-- anti-pattern shortcut -->
  <line x1="244" y1="218" x2="344" y2="300" stroke="#b3554e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)"/>
  <line x1="286.4" y1="268.3" x2="301.6" y2="249.7" stroke="#b3554e" stroke-width="2.2"/>
  <text x="320" y="255" font-size="11.5" fill="#b3554e">debugging by anecdote</text>
</svg>
