<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7dbe"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4e8a52"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="430" fill="white"/>

  <!-- actor -->
  <rect x="200" y="48" width="200" height="58" rx="6" fill="#dbe7f5" stroke="#4a7dbe"/>
  <text x="300" y="71" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Actor</text>
  <text x="300" y="88" text-anchor="middle" font-size="11.5" fill="#555">runs one trial (a Ch. 4 loop)</text>

  <line x1="300" y1="106" x2="300" y2="164" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="310" y="138" font-size="11.5" fill="#555">trial record</text>

  <!-- evaluator -->
  <rect x="200" y="168" width="200" height="58" rx="6" fill="#fff7e0" stroke="#c9a227"/>
  <text x="300" y="191" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Evaluator</text>
  <text x="300" y="208" text-anchor="middle" font-size="11.5" fill="#555">did the trial succeed?</text>

  <!-- success exit -->
  <line x1="196" y1="197" x2="144" y2="197" stroke="#4e8a52" stroke-width="1.6" marker-end="url(#arrG)"/>
  <text x="170" y="186" text-anchor="middle" font-size="11.5" fill="#4e8a52">success</text>
  <rect x="20" y="173" width="120" height="48" rx="6" fill="#eaf3eb" stroke="#4e8a52"/>
  <text x="80" y="192" text-anchor="middle" font-size="13" fill="#222">Done</text>
  <text x="80" y="209" text-anchor="middle" font-size="11.5" fill="#555">return result</text>

  <line x1="300" y1="226" x2="300" y2="284" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="310" y="258" font-size="11.5" fill="#b3554e">failure</text>

  <!-- reflection -->
  <rect x="200" y="288" width="200" height="58" rx="6" fill="#dbe7f5" stroke="#4a7dbe"/>
  <text x="300" y="311" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Reflection</text>
  <text x="300" y="328" text-anchor="middle" font-size="11.5" fill="#555">why it failed, what to change</text>

  <!-- memo into memory -->
  <line x1="404" y1="317" x2="556" y2="272" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="472" y="280" text-anchor="middle" font-size="11.5" fill="#555">reflection memo</text>

  <!-- episodic memory -->
  <rect x="560" y="96" width="310" height="230" rx="6" fill="#fafafa" stroke="#888"/>
  <text x="715" y="122" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Episodic memory</text>
  <text x="715" y="140" text-anchor="middle" font-size="11.5" fill="#555">plain text, one memo per failed trial</text>

  <rect x="580" y="154" width="270" height="40" rx="4" fill="white" stroke="#bbbbbb"/>
  <text x="590" y="170" font-size="11.5" fill="#222">Trial 1 &#8212; failed test 3 (empty list).</text>
  <text x="590" y="186" font-size="11.5" fill="#555">Handle the empty list before indexing.</text>

  <rect x="580" y="200" width="270" height="40" rx="4" fill="white" stroke="#bbbbbb"/>
  <text x="590" y="216" font-size="11.5" fill="#222">Trial 2 &#8212; &#8216;year&#8217; query found nothing.</text>
  <text x="590" y="232" font-size="11.5" fill="#555">Search title + venue, then answer.</text>

  <rect x="580" y="246" width="270" height="40" rx="4" fill="none" stroke="#bbbbbb" stroke-dasharray="4 3"/>
  <text x="715" y="270" text-anchor="middle" font-size="11.5" fill="#999">+ appended after each failure</text>

  <text x="715" y="348" text-anchor="middle" font-size="11.5" fill="#555">this text is what improves the next trial</text>

  <!-- memory feeds next attempt -->
  <path d="M 700 96 L 700 77 L 404 77" fill="none" stroke="#4a7dbe" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="560" y="66" text-anchor="middle" font-size="11.5" fill="#4a7dbe">retry (capped) &#8212; memos prepended to the next prompt</text>

  <!-- no weight update -->
  <rect x="230" y="368" width="140" height="30" rx="5" fill="#f5f5f5" stroke="#bbbbbb"/>
  <text x="300" y="387" text-anchor="middle" font-size="12" fill="#999">weight update</text>
  <line x1="236" y1="394" x2="364" y2="372" stroke="#b3554e" stroke-width="2"/>
  <text x="386" y="387" font-size="11.5" fill="#b3554e">none &#8212; the model stays frozen</text>
</svg>
