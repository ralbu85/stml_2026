<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Failed and successful paths to 24</title><desc id="desc">One path leaves 2 and 50, which cannot combine to make 24. A different first choice leads to 5,6,6, then 6,30, then 24. Only selected paths are displayed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs>
<rect width="1100" height="620" fill="white"/>
<rect x="395" y="10" width="310" height="75" rx="8" fill="#f3f4f6" stroke="#667085" stroke-width="2"/>
<text x="550.0" y="56.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">4, 5, 6, 10</text>
<path d="M490 85 L260 180" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M610 85 L840 180" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="235" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#435267">6 − 4 = 2</text>
<text x="865" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#435267">10 − 4 = 6</text>
<rect x="85" y="180" width="350" height="90" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="260.0" y="234.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">2, 5, 10</text>
<rect x="665" y="180" width="350" height="90" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="840.0" y="217.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">5, 6, 6</text>
<text x="840.0" y="251.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">New 6 = 10 − 4</text>
<path d="M260 270 V355" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="435" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#435267">10 × 5 = 50</text>
<path d="M840 270 V355" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#435267">5 × new 6 = 30</text>
<rect x="140" y="355" width="240" height="70" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="260.0" y="399.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">2, 50</text>
<rect x="720" y="355" width="240" height="70" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="840.0" y="399.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">6, 30</text>
<path d="M260 425 V510" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M840 425 V510" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="635" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#435267">30 − 6 = 24</text>
<rect x="100" y="510" width="320" height="80" rx="8" fill="#fff2e9" stroke="#a96637" stroke-width="2"/>
<text x="260.0" y="559.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">Cannot make 24</text>
<rect x="720" y="510" width="240" height="80" rx="8" fill="#edf7f0" stroke="#417452" stroke-width="2"/>
<text x="840.0" y="559.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#172a43">24</text>
</svg>
