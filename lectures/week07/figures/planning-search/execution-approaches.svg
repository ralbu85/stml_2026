<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="365" viewBox="0 0 1100 365" role="img" aria-labelledby="title desc">
<title id="title">How observations enter action decisions</title><desc id="desc">Both rows execute dependent tool requests in order. The upper row uses a result to choose the next request; the lower row supplies it to a request already specified in the plan.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs>
<rect width="1100" height="365" fill="white"/>
<text x="550" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#435267">Interleave reasoning and tool execution</text>
<rect x="20" y="60" width="180" height="85" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="110.0" y="94.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">Choose</text>
<text x="110.0" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">action 1</text>
<rect x="240" y="60" width="180" height="85" rx="8" fill="#eef7f0" stroke="#568267" stroke-width="2"/>
<text x="330.0" y="94.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">Run</text>
<text x="330.0" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">action 1</text>
<rect x="460" y="60" width="180" height="85" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="550.0" y="94.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">Use result to</text>
<text x="550.0" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">choose action 2</text>
<rect x="680" y="60" width="180" height="85" rx="8" fill="#eef7f0" stroke="#568267" stroke-width="2"/>
<text x="770.0" y="94.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">Run</text>
<text x="770.0" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">action 2</text>
<rect x="900" y="60" width="180" height="85" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="990.0" y="94.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">Produce</text>
<text x="990.0" y="128.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#172a43">answer</text>
<path d="M200 103 H240" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M420 103 H460" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M640 103 H680" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M860 103 H900" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="550" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#435267">Separate advance planning from tool execution</text>
<rect x="20" y="240" width="290" height="85" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="165.0" y="274.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Plan requests</text>
<text x="165.0" y="308.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">and dependencies</text>
<rect x="365" y="240" width="220" height="85" rx="8" fill="#eef7f0" stroke="#568267" stroke-width="2"/>
<text x="475.0" y="274.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Run</text>
<text x="475.0" y="308.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">action 1</text>
<rect x="640" y="240" width="220" height="85" rx="8" fill="#eef7f0" stroke="#568267" stroke-width="2"/>
<text x="750.0" y="274.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Use result to</text>
<text x="750.0" y="308.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">run action 2</text>
<rect x="915" y="240" width="165" height="85" rx="8" fill="#edf3fb" stroke="#526e97" stroke-width="2"/>
<text x="997.5" y="274.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">Produce</text>
<text x="997.5" y="308.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#172a43">answer</text>
<path d="M310 283 H365" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M585 283 H640" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M860 283 H915" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
