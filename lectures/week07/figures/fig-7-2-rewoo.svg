<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a227"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="white"/>

  <text x="450" y="40" text-anchor="middle" font-size="13" fill="#555">ReWOO &#8212; reasoning without observation</text>

  <!-- ================= module row ================= -->
  <rect x="24" y="96" width="104" height="56" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="76" y="118" text-anchor="middle" font-size="13" fill="#222">Question</text>
  <text x="76" y="136" text-anchor="middle" font-size="10.5" fill="#555">multi-step</text>

  <line x1="128" y1="124" x2="164" y2="124" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="168" y="90" width="148" height="68" rx="6" fill="#dbe7f5" stroke="#4a7dbe" stroke-width="1.5"/>
  <text x="242" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Planner</text>
  <text x="242" y="130" text-anchor="middle" font-size="11" fill="#4a7dbe">LLM &#8212; call 1 of 2</text>
  <text x="242" y="147" text-anchor="middle" font-size="10.5" fill="#777">writes the whole plan</text>

  <line x1="316" y1="124" x2="396" y2="124" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="400" y="90" width="170" height="68" rx="6" fill="#eeeeee" stroke="#888"/>
  <text x="485" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Worker</text>
  <text x="485" y="130" text-anchor="middle" font-size="11" fill="#555">code &#8212; 0 LLM calls</text>
  <text x="485" y="147" text-anchor="middle" font-size="10.5" fill="#777">runs search_papers &#215;4</text>

  <line x1="570" y1="124" x2="646" y2="124" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="650" y="90" width="148" height="68" rx="6" fill="#dbe7f5" stroke="#4a7dbe" stroke-width="1.5"/>
  <text x="724" y="112" text-anchor="middle" font-size="13.5" font-weight="600" fill="#222">Solver</text>
  <text x="724" y="130" text-anchor="middle" font-size="11" fill="#4a7dbe">LLM &#8212; call 2 of 2</text>
  <text x="724" y="147" text-anchor="middle" font-size="10.5" fill="#777">reads plan + results</text>

  <!-- ================= plan document ================= -->
  <line x1="242" y1="158" x2="242" y2="196" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="252" y="182" font-size="10.5" fill="#777">one pass</text>

  <rect x="168" y="200" width="300" height="124" rx="6" fill="#fff7e0" stroke="#c9a227"/>
  <text x="180" y="220" font-size="11.5" fill="#555">plan &#8212; variables for absent results</text>
  <text x="180" y="244" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">#E1 = search_papers["ReAct date"]</text>
  <text x="180" y="263" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">#E2 = search_papers["Reflexion date"]</text>
  <text x="180" y="282" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">#E3 = search_papers["ReAct eval tasks"]</text>
  <text x="180" y="301" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">#E4 = search_papers["Reflexion eval tasks"]</text>

  <!-- plan read by worker -->
  <line x1="432" y1="197" x2="478" y2="163" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- ================= results document ================= -->
  <line x1="545" y1="158" x2="577" y2="196" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="588" y="180" font-size="10.5" fill="#777">fills #E1&#8211;#E4</text>

  <rect x="505" y="200" width="250" height="124" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="517" y="220" font-size="11.5" fill="#555">results &#8212; filled by tools</text>
  <text x="517" y="244" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">#E1 = "Oct 2022"</text>
  <text x="517" y="263" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">#E2 = "Mar 2023"</text>
  <text x="517" y="282" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">#E3 = "HotpotQA, FEVER, &#8230;"</text>
  <text x="517" y="301" font-size="10.5" fill="#222" font-family="Menlo, Consolas, monospace">#E4 = "ALFWorld, HumanEval, &#8230;"</text>

  <!-- results read by solver, once -->
  <line x1="712" y1="196" x2="719" y2="164" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="726" y="184" font-size="10.5" fill="#777">sent once</text>

  <!-- plan read again by solver, unchanged -->
  <path d="M 468 300 C 590 400, 900 380, 770 162" fill="none" stroke="#c9a227" stroke-width="1.4" marker-end="url(#arrY)"/>
  <text x="615" y="368" text-anchor="middle" font-size="10.5" fill="#777">plan travels unchanged to the Solver</text>

  <!-- ================= answer ================= -->
  <path d="M 798 124 L 836 124 L 836 405 L 812 405" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="846" y="264" text-anchor="middle" font-size="10.5" fill="#555" transform="rotate(-90 846 264)">final answer</text>

  <rect x="580" y="380" width="224" height="50" rx="6" fill="#ffffff" stroke="#4e8a52" stroke-width="1.5"/>
  <text x="692" y="399" text-anchor="middle" font-size="12" fill="#222">Reflexion is the later paper</text>
  <text x="692" y="418" text-anchor="middle" font-size="10.5" fill="#555">ALFWorld &#183; HotpotQA &#183; HumanEval</text>

  <!-- ================= cost note ================= -->
  <text x="24" y="392" font-size="11.5" fill="#666">LLM calls: 2, whatever the step count</text>
  <text x="24" y="410" font-size="11.5" fill="#666">observations enter one context once &#8212; the Solver&#8217;s</text>
</svg>
