<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4e8a52"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cccccc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="460" fill="white"/>

  <!-- ================= left inset: greedy / CoT ================= -->
  <text x="108" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#222">greedy / CoT</text>
  <text x="108" y="62" text-anchor="middle" font-size="11.5" fill="#666">one linear path</text>

  <rect x="53" y="88" width="110" height="30" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="108" y="107" text-anchor="middle" font-size="10.5" fill="#222">4, 9, 10, 13</text>
  <line x1="108" y1="118" x2="108" y2="146" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="53" y="152" width="110" height="30" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="108" y="171" text-anchor="middle" font-size="10.5" fill="#222">4+9 &#8594; 13,10,13</text>
  <line x1="108" y1="182" x2="108" y2="210" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="53" y="216" width="110" height="30" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="108" y="235" text-anchor="middle" font-size="10.5" fill="#222">13+10 &#8594; 23,13</text>
  <line x1="108" y1="246" x2="108" y2="274" stroke="#555" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="53" y="280" width="110" height="30" rx="5" fill="#ffffff" stroke="#b3554e" stroke-width="1.4"/>
  <text x="108" y="299" text-anchor="middle" font-size="10.5" fill="#b3554e">stuck: no 24</text>

  <text x="108" y="344" text-anchor="middle" font-size="11.5" fill="#666">no compare, no return</text>

  <!-- divider -->
  <line x1="210" y1="30" x2="210" y2="440" stroke="#cccccc" stroke-dasharray="4 4"/>

  <!-- ================= main: Tree of Thoughts ================= -->
  <text x="430" y="44" text-anchor="middle" font-size="16" font-weight="600" fill="#222">Tree of Thoughts</text>
  <text x="430" y="63" text-anchor="middle" font-size="11.5" fill="#666">candidates graded, pruned, backtracked</text>

  <!-- legend -->
  <path d="M 694 37 l 3.5 4 l 6.5 -8.5" fill="none" stroke="#4e8a52" stroke-width="1.9"/>
  <text x="710" y="42" font-size="10.5" fill="#555">sure</text>
  <text x="748" y="43" font-size="12.5" font-weight="700" fill="#c9a227">?</text>
  <text x="760" y="42" font-size="10.5" fill="#555">maybe</text>
  <line x1="810" y1="33" x2="818" y2="41" stroke="#b3554e" stroke-width="1.9"/>
  <line x1="818" y1="33" x2="810" y2="41" stroke="#b3554e" stroke-width="1.9"/>
  <text x="824" y="42" font-size="10.5" fill="#555">impossible</text>
  <text x="694" y="61" font-size="10.5" fill="#777">dimmed = pruned (b = 2 kept)</text>

  <!-- edges -->
  <line x1="560" y1="122" x2="360" y2="172" stroke="#4e8a52" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="560" y1="122" x2="610" y2="172" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="122" x2="813" y2="172" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrD)"/>

  <line x1="360" y1="222" x2="281" y2="272" stroke="#4e8a52" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="360" y1="222" x2="449" y2="272" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrD)"/>
  <line x1="610" y1="222" x2="615" y2="272" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="222" x2="788" y2="272" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrD)"/>

  <line x1="280" y1="322" x2="280" y2="372" stroke="#4e8a52" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="615" y1="322" x2="615" y2="372" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- backtrack (DFS) -->
  <path d="M 684 382 C 726 356, 726 324, 683 297" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="722" y="346" font-size="10.5" fill="#555">backtrack</text>

  <!-- root -->
  <text x="560" y="82" text-anchor="middle" font-size="10.5" fill="#777">root &#8212; make 24</text>
  <rect x="495" y="90" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="560" y="110" text-anchor="middle" font-size="11" fill="#222">4, 9, 10, 13</text>

  <!-- depth 1 -->
  <rect x="295" y="174" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="304" y="194" font-size="10.5" fill="#222">13&#8722;9 &#8594; 4,4,10</text>
  <text x="410" y="195" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c9a227">?</text>

  <rect x="545" y="174" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="554" y="194" font-size="10.5" fill="#222">10&#8722;4 &#8594; 6,9,13</text>
  <text x="660" y="195" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c9a227">?</text>

  <g opacity="0.42">
    <rect x="750" y="174" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
    <text x="759" y="194" font-size="10.5" fill="#222">13&#215;10 &#8594; 130,4,9</text>
    <line x1="861" y1="186" x2="869" y2="194" stroke="#b3554e" stroke-width="2"/>
    <line x1="869" y1="186" x2="861" y2="194" stroke="#b3554e" stroke-width="2"/>
  </g>

  <!-- depth 2 -->
  <rect x="215" y="274" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="224" y="294" font-size="10.5" fill="#222">10&#8722;4 &#8594; 4,6</text>
  <path d="M 322 290 l 4 4.5 l 8 -9.5" fill="none" stroke="#4e8a52" stroke-width="2"/>

  <g opacity="0.42">
    <rect x="385" y="274" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
    <text x="394" y="294" font-size="10.5" fill="#222">4+4 &#8594; 8,10</text>
    <line x1="496" y1="286" x2="504" y2="294" stroke="#b3554e" stroke-width="2"/>
    <line x1="504" y1="286" x2="496" y2="294" stroke="#b3554e" stroke-width="2"/>
  </g>

  <rect x="550" y="274" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="559" y="294" font-size="10.5" fill="#222">6+9 &#8594; 15,13</text>
  <text x="665" y="295" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c9a227">?</text>

  <g opacity="0.42">
    <rect x="725" y="274" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
    <text x="734" y="294" font-size="10.5" fill="#222">13&#8722;6 &#8594; 7,9</text>
    <line x1="836" y1="286" x2="844" y2="294" stroke="#b3554e" stroke-width="2"/>
    <line x1="844" y1="286" x2="836" y2="294" stroke="#b3554e" stroke-width="2"/>
  </g>

  <!-- depth 3 -->
  <rect x="215" y="374" width="130" height="32" rx="5" fill="#ffffff" stroke="#4e8a52" stroke-width="1.6"/>
  <text x="272" y="394" text-anchor="middle" font-size="11.5" fill="#222">4 &#215; 6 = 24</text>
  <path d="M 322 390 l 4 4.5 l 8 -9.5" fill="none" stroke="#4e8a52" stroke-width="2"/>
  <text x="280" y="424" text-anchor="middle" font-size="10.5" fill="#4e8a52">goal</text>

  <rect x="550" y="374" width="130" height="32" rx="5" fill="#eeeeee" stroke="#888"/>
  <text x="559" y="394" font-size="10.5" fill="#222">15+13 &#8594; 28</text>
  <line x1="661" y1="386" x2="669" y2="394" stroke="#b3554e" stroke-width="2"/>
  <line x1="669" y1="386" x2="661" y2="394" stroke="#b3554e" stroke-width="2"/>
</svg>
